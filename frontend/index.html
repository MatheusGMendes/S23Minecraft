<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>S23 Minecraft</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="container">
    <header>
      <h1>S23 Minecraft</h1>
      <p class="subtitle" id="subtitle">…</p>
    </header>

    <section class="status-card">
      <div class="status-row">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">…</span>
        <span class="players" id="players-text"></span>
      </div>
      <div class="players-list" id="players-list" hidden></div>
      <div class="motd-line" id="motd-line"></div>
      <div class="description-line" id="description-line" hidden></div>
      <div class="connect-line" id="connect-line"></div>
      <div class="season-row">
        <span class="season-label" id="season-label">Season</span>
        <span class="season-progress"><span id="season-bar"></span></span>
        <span class="season-info" id="season-info">…</span>
      </div>
      <button id="extend-btn" type="button" class="extend-btn" hidden>Extend season by 5 days</button>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab" type="button" data-tab="settings" hidden>New season</button>
      <button class="tab active" type="button" data-tab="logs">Server</button>
    </nav>

    <div class="tab-panel" data-tab="settings" hidden>
      <section class="settings-card">
        <form id="settings-form">
          <p class="muted">Submitting starts a complete new server with its own world. The current server is archived and will be reachable from the Seasons page (coming soon).</p>
          <div class="grid"></div>
          <button type="submit" id="apply-btn">Start new server</button>
        </form>
      </section>
    </div>

    <div class="tab-panel" data-tab="logs">
      <section class="settings-card mods-card" id="mods-card" hidden>
        <h2>Mods</h2>
        <p class="muted" id="mods-blurb">Upload mod jars while the setup window is open.</p>
        <div class="mods-uploader" id="mods-edit-row">
          <input id="mods-input" type="file" accept=".jar" multiple hidden />
          <label for="mods-input" class="mods-pick">
            <span id="mods-pick-label">Upload .jar files</span>
          </label>
        </div>
        <ul id="mods-list" class="mods-list"></ul>
        <div class="mods-apply-row" id="mods-apply-row" hidden>
          <p class="muted mods-apply-hint" id="mods-apply-hint"></p>
          <label class="mods-wipe-toggle">
            <input type="checkbox" id="mods-wipe-toggle" />
            <span>Reset world (worldgen-affecting mods)</span>
          </label>
          <button id="mods-apply-btn" type="button" class="extend-btn">
            Apply and restart
          </button>
          <button id="mods-discard-btn" type="button" class="mods-discard-btn" hidden>
            Discard pending uploads
          </button>
        </div>
        <button id="mods-end-btn" type="button" class="extend-btn">
          End setup &amp; lock mods
        </button>
      </section>
      <section class="logs-card">
        <div class="logs-header">
          <h2>Server logs</h2>
          <label class="logs-follow"><input type="checkbox" id="logs-follow" checked /> follow</label>
        </div>
        <pre id="logs" class="logs-pre">(idle)</pre>
      </section>
      <section class="settings-card seasons-card" id="seasons-card" hidden>
        <h2>Past seasons</h2>
        <ul id="seasons-list" class="seasons-list"></ul>
        <button id="seasons-more-btn" type="button" class="seasons-more-btn" hidden>
          Load more
        </button>
      </section>
    </div>
  </main>
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop"></div>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 class="modal-title" id="modal-title"></h3>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
