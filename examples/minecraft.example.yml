# Example Minecraft compose managed by S23Minecraft.
#
# The S23Minecraft manager writes a .env file in this directory with:
#   SEASON_NAME=season-NNN-YYYYMMDD
#   VERSION, DIFFICULTY, MODE, SEED, ONLINE_MODE, MOTD, OPS, ICON
#
# Anything you don't want players to control (memory, max players, EULA,
# RCON password, network, etc.) — hardcode it here.
#
# Each new season gets its own data + backups folder, so old seasons survive
# as on-disk archives. SERVERS_DIR is the folder where season subfolders
# live; BACKUPS_DIR is the folder where backups live. Both come from the
# manager's environment block — adjust there.

services:
  minecraft:
    container_name: s23-minecraft
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    ports:
      - "25565:25565"
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      MAX_PLAYERS: "20"
      # TYPE is templated by the manager (.env). Allowed: VANILLA, FORGE, FABRIC.
      TYPE: ${TYPE:-VANILLA}
      PVP: "true"
      VIEW_DISTANCE: "8"
      MAX_WORLD_SIZE: "5000"
      OVERRIDE_ICON: "true"
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      SPAWN_PROTECTION: "0"

      # RCON — required so the backup container can flush saves before snapshotting.
      # The manager generates RCON_PASSWORD on first start and writes it to .env.
      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}

      # Player-controlled — leave these as ${VAR:-default}.
      VERSION:     ${VERSION:-LATEST}
      DIFFICULTY:  ${DIFFICULTY:-normal}
      MODE:        ${MODE:-survival}
      SEED:        ${SEED:-}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      MOTD:        ${MOTD:-S23 Minecraft}
      OPS:         ${OPS:-}
      ICON:        ${ICON:-}

  backups:
    container_name: s23-minecraft-backups
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      - minecraft
    environment:
      BACKUP_INTERVAL: "12h"
      PRUNE_BACKUPS_DAYS: "3"
      BACKUP_ON_STARTUP: "TRUE"
      PAUSE_IF_NO_PLAYERS: "TRUE"
      PLAYERS_ONLINE_CHECK_INTERVAL: "5m"
      INITIAL_DELAY: "30"
      RCON_HOST: "s23-minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}              # auto-generated by the manager
      EXCLUDES: ""
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data:ro
      - ${BACKUPS_DIR:-/srv/minecraft-backups}/${SEASON_NAME}:/backups

  # Manual restore — runs only when invoked. Use:
  #   docker compose run --rm restore-backup
  # or via the manager:
  #   docker exec s23-minecraft-manager s23 restore
  restore-backup:
    image: itzg/mc-backup
    restart: "no"
    entrypoint: restore-tar-backup
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data
      - ${BACKUPS_DIR:-/srv/minecraft-backups}/${SEASON_NAME}:/backups:ro
