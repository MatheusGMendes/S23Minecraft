# Minecraft compose, deployed inside the Lima VM. The MC server runs
# alongside its backup/restore sidecars (so they share /data directly).
# The manager runs on the host docker daemon.
#
# .env is rewritten by the manager on each boot.

services:
  minecraft:
    container_name: s23-minecraft
    image: itzg/minecraft-server:latest
    restart: unless-stopped

    cap_drop: ["ALL"]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 4096
    mem_limit: "11g"
    cpus: 4
    tmpfs:
      # `exec` is critical: docker's tmpfs short-form mounts noexec by
      # default, which breaks itzg's mc-image-helper — netty extracts a
      # native epoll lib to /tmp and the noexec blocks it, the warning
      # leaks into stdout, and itzg's version-resolution capture parses
      # the garbled output as a missing manifest entry.
      - /tmp:size=512m,mode=1777,exec

    ports:
      - "25565:25565"
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data
    environment:
      EULA: "TRUE"
      MEMORY: "10G"
      MAX_PLAYERS: "20"
      TYPE: ${TYPE:-VANILLA}
      PVP: "true"
      VIEW_DISTANCE: "8"
      MAX_WORLD_SIZE: "5000"
      OVERRIDE_ICON: "true"
      PAUSE_WHEN_EMPTY_SECONDS: "0"
      SPAWN_PROTECTION: "0"

      ENABLE_RCON: "true"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}

      VERSION:     ${VERSION:-LATEST}
      DIFFICULTY:  ${DIFFICULTY:-normal}
      MODE:        ${MODE:-survival}
      SEED:        ${SEED:-}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      MOTD:        ${MOTD:-S23 Minecraft}
      OPS:         ${OPS:-}
      ICON:        ${ICON:-}

      WHITE_LIST:                ${WHITE_LIST:-FALSE}
      ENFORCE_WHITELIST:         ${ENFORCE_WHITELIST:-FALSE}
      EXISTING_WHITELIST_FILE:   ${EXISTING_WHITELIST_FILE:-SKIP}
      WHITELIST:                 ${WHITELIST:-}

  backups:
    container_name: s23-minecraft-backups
    image: itzg/mc-backup
    restart: unless-stopped
    depends_on:
      - minecraft

    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 1024
    mem_limit: "1g"

    environment:
      BACKUP_INTERVAL: "12h"
      PRUNE_BACKUPS_DAYS: "3"
      BACKUP_ON_STARTUP: "TRUE"
      PAUSE_IF_NO_PLAYERS: "TRUE"
      PLAYERS_ONLINE_CHECK_INTERVAL: "5m"
      INITIAL_DELAY: "30"
      RCON_HOST: "s23-minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      EXCLUDES: ""
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data:ro
      - ${BACKUPS_DIR:-/srv/minecraft-backups}/${SEASON_NAME}:/backups

  # On-demand one-shot backup, invoked by the manager during season
  # transitions. Run with: docker compose --profile manual run --rm backup-now
  backup-now:
    image: itzg/mc-backup
    restart: "no"
    profiles: ["manual"]
    entrypoint: backup-tar-task
    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - "no-new-privileges:true"
    environment:
      SRC_DIR: "/data"
      DEST_DIR: "/backups"
      EXCLUDES: ""
      RCON_HOST: "s23-minecraft"
      RCON_PORT: "25575"
      RCON_PASSWORD: ${RCON_PASSWORD}
      PRUNE_BACKUPS_DAYS: "0"
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data:ro
      - ${BACKUPS_DIR:-/srv/minecraft-backups}/${SEASON_NAME}:/backups

  restore-backup:
    image: itzg/mc-backup
    restart: "no"
    profiles: ["manual"]
    entrypoint: restore-tar-backup
    cap_drop: ["ALL"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - "no-new-privileges:true"
    volumes:
      - ${SERVERS_DIR:-/srv/minecraft/seasons}/${SEASON_NAME}:/data
      - ${BACKUPS_DIR:-/srv/minecraft-backups}/${SEASON_NAME}:/backups:ro
