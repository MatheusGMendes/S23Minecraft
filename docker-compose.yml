# Example compose for the S23 manager. Copy this file, change the
# two placeholder paths below to wherever you keep things, and run
# `docker compose up -d`.
#
# Two folders to fill in (search-and-replace before deploying):
#   MINESMFOLDER  — host folder for everything the manager owns: the MC
#                   compose (<basename>.yml + <basename>.env), the
#                   manager's state.db, and the season-NNN-YYYYMMDD
#                   subdirs (MC server worlds). Its basename becomes the
#                   project name in OMV's compose UI.
#   BKPFOLDER     — host folder for backup tars (.tgz files).

services:
  s23-minecraft-manager:
    image: ghcr.io/matheusgmendes/s23minecraft:latest
    container_name: s23-minecraft-manager
    ports:
      - "3002:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Manager-owned root: <name>.yml + <name>.env (MC compose),
      # state.db (manager), season-NNN-YYYYMMDD subdirs (MC worlds).
      - MINESMFOLDER:/minesm
      # Per-season backup tars, read-only (the MC backup sidecar writes them).
      - BKPFOLDER:/backups:ro
      # Docker socket — manager bounces the MC stack via `docker compose`.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HIDDEN_OPS: "Mendes57"
    restart: unless-stopped
