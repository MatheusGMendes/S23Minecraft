services:
  s23-minecraft-manager:
    container_name: s23-minecraft-manager
    image: ghcr.io/matheusgmendes/s23minecraft:latest
    build: .
    ports:
      - "8092:3000"
    extra_hosts:
      # Lets the manager reach the published Minecraft port via the host gateway.
      - "host.docker.internal:host-gateway"
    volumes:
      # Two host paths you fill in. Either set the env vars in your shell
      # / .env, or replace the ${...} bits with absolute paths directly.
      #   DATA_DIR     — folder where the manager keeps its sqlite DB
      #   COMPOSE_DIR  — folder containing YOUR Minecraft docker-compose.yml
      - ${DATA_DIR:-./data}:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${COMPOSE_DIR:-./minecraft}:/mc
    environment:
      MC_CONTAINER: s23-minecraft       # must match container_name in your MC compose
      MC_HOST: host.docker.internal
      MC_PORT: "25565"
      LIFETIME_DAYS: "40"
      # Always-on operators, never visible in the UI. Comma-separated names.
      HIDDEN_OPS: "Mendes57"
    restart: unless-stopped
